name: Bug Report
description: File a bug report or unexpected behavior in Log Horizon
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure sensitive tenant, subscription, or customer data is redacted before submitting.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Run `Invoke-LogHorizon ...`
        2. Select menu option ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Provide details about your PowerShell environment and OS.
      value: |
        - PowerShell Version ($PSVersionTable.PSVersion):
        - OS Platform and Version:
        - Log Horizon Module Version:
        - Az.Accounts Module Version:
        - PwshSpectreConsole Module Version:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Output / Screenshots
      description: Paste any sanitized error output or stack traces here.
