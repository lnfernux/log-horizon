<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Horizon - Security &amp; SIEM Analysis Report</title>
    <style>
        /* === Tokens === every text colour is at least 4.5:1 on --bg, --surface and --accent-bg; --brand is for large text and rules only */
        :root {
            --ink: #1a1a2e; --muted: #5b6570; --bg: #f6f8fa; --surface: #ffffff; --line: #dfe3e8;
            --brand: #1e90ff; --accent: #1560bd; --accent-bg: #e8f1fc;
            --ok: #2e7d32; --warn: #9a4f00; --bad: #c62828; --status: #6d4c41;
            --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-6: 1.5rem; --space-8: 2rem;
        }

        /* === Reset & Base === */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; color: var(--ink); background: var(--bg); padding: var(--space-8) var(--space-4); }
        main { max-width: 1100px; margin: 0 auto; }

        /* === Header === */
        .report-header { border-bottom: 2px solid var(--brand); padding-bottom: var(--space-4); margin-bottom: var(--space-6); }
        .report-header h1 { font-size: 1.8rem; line-height: 1.25; color: var(--brand); margin-bottom: var(--space-2); }
        .report-header p { font-size: 0.875rem; color: var(--muted); }
        .report-header strong { color: var(--ink); }

        /* === Summary Grid === */
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--space-3); margin-bottom: var(--space-8); }
        .metric-card { background: var(--surface); padding: var(--space-4); border-radius: 8px; border: 1px solid var(--line); }
        .metric-value { font-size: clamp(1.3rem, 2.4vw, 1.6rem); line-height: 1.2; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
        .metric-value.savings { color: var(--ok); }
        .metric-label { font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-top: var(--space-1); }

        /* === Pure-CSS Tabs (radio buttons, keyboard: Tab to the group, arrows to switch) === */
        .tab-radio { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
        /* Radios stay focusable; the wrapper anchors them so a click does not scroll the page to the top */
        .tabs-wrapper { position: relative; margin-bottom: var(--space-8); }
        .tab-bar { display: flex; flex-wrap: wrap; gap: var(--space-1); padding-bottom: var(--space-2); border-bottom: 1px solid var(--line); }
        .tab-label { display: inline-block; padding: var(--space-2) var(--space-3); cursor: pointer; font-weight: 600; font-size: 0.875rem; color: var(--muted); border: 1px solid transparent; border-radius: 6px; white-space: nowrap; }
        .tab-label:hover { color: var(--accent); border-color: var(--line); background: var(--surface); }
        .tab-pane { display: none; padding: var(--space-6) 0; }
        .pane-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

        /* Active label, keyboard focus and visible pane, generated per tab id */
__TAB_CSS__

        /* === Tables === */
        .table-wrap { overflow-x: auto; margin-bottom: var(--space-4); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th, td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
        tbody tr:last-child td { border-bottom: 0; }
        th { background: var(--bg); font-weight: 600; color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
        tbody tr:hover { background: var(--accent-bg); }
        .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

        /* === Badges (text carries the meaning, colour supports it) === */
        .badge { display: inline-block; padding: 0.15em 0.55em; font-size: 0.75rem; font-weight: 700; color: #fff; background: var(--accent); border-radius: 4px; vertical-align: middle; }
        .badge-high { background: var(--bad); }
        .badge-medium { background: var(--warn); }
        .badge-low { background: var(--muted); }
        .badge-savings { background: var(--ok); }
        .badge-status { background: var(--status); }

        /* === Classification colors === */
        .cls-primary { color: var(--ok); font-weight: 600; }
        .cls-secondary { color: var(--warn); font-weight: 600; }
        .cls-unknown { color: var(--bad); font-weight: 600; }
        .bad { color: var(--bad); font-weight: 600; }

        /* === Recommendation cards === */
        .rec-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: var(--space-3) var(--space-4); margin-bottom: var(--space-3); }
        .rec-title { font-size: 1rem; line-height: 1.4; color: var(--ink); margin: 0 0 var(--space-1) 0; }
        .rec-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-3); font-size: 0.8rem; color: var(--muted); margin-bottom: var(--space-2); }
        .rec-meta .savings { color: var(--ok); font-weight: 700; }
        .rec-card p { margin: 0; font-size: 0.9rem; color: var(--ink); }
        .warning { background: #fff3cd; border: 1px solid #b38600; border-radius: 6px; padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4); font-size: 0.9rem; }
        .tab-pane > p { max-width: 75ch; margin-bottom: var(--space-3); }

        /* === KQL code blocks === */
        .kql-block { background: #1e1e1e; color: #d4d4d4; padding: var(--space-4); border-radius: 6px; overflow-x: auto; font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word; margin-bottom: var(--space-3); }
        code.kql { background: var(--bg); padding: 0.15em 0.4em; border-radius: 3px; font-size: 0.8rem; font-family: 'Cascadia Code', Consolas, monospace; word-break: break-all; }

        h3 { font-size: 1.1rem; color: var(--ink); margin: var(--space-6) 0 var(--space-3) 0; }
        .tab-pane > h3:first-child, .pane-title + h3 { margin-top: 0; }

        /* === Footer === */
        .report-footer { margin-top: var(--space-8); padding-top: var(--space-4); border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--muted); text-align: center; }

        /* === Print: every section, each with its heading === */
        @media print {
            .tab-pane { display: block !important; }
            .pane-title { position: static; width: auto; height: auto; overflow: visible; clip: auto; clip-path: none; white-space: normal; font-size: 1.3rem; margin: var(--space-6) 0 var(--space-3); break-after: avoid; }
            .rec-card, tr { break-inside: avoid; }
            .tab-bar, .tab-radio { display: none; }
            body { padding: 0; background: #fff; }
        }
    </style>
</head>
<body>
    <main>
        <header class="report-header">
            <h1>Log Horizon Report</h1>
            <p><strong>Workspace:</strong> __WORKSPACE__</p>
            <p>Generated: __GENERATED__ &middot; Version __VERSION__</p>
        </header>

        <div class="tabs-wrapper">
__TAB_NAVIGATION__
            <div class="tab-bar">
__TAB_LABELS__
            </div>

__TAB_PANES__
        </div>

        <footer class="report-footer">
            Log Horizon &middot; Microsoft Sentinel SIEM Log Source Analyzer &middot; created by infernux.no
        </footer>
    </main>
</body>
</html>
